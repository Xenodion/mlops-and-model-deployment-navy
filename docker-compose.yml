#   docker compose up -d                  # S3 + MLflow
#
# URLs : MLflow http://localhost:5000
#        S3 file browser http://localhost:8888/buckets/ · SeaweedFS status http://localhost:9333

name: ride-mlops

x-s3-env: &s3-env
  AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-mlops}
  AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-mlops-secret}
  AWS_DEFAULT_REGION: us-east-1
  MLFLOW_S3_ENDPOINT_URL: http://s3:8333

services:
  # S3 storage - remote DVC & MLflow artifact store
  s3:
    image: chrislusf/seaweedfs:${SEAWEEDFS_VERSION:-latest}
    # The S3 API and the filer must use different ports: the filer listens on 8888 by default.
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -volume.max=20
    ports:
      - "8333:8333"   # S3 API (DVC, MLflow, boto3): signed requests only, no web page
      - "8888:8888"   # filer: browse files in a browser at /buckets/
      - "9333:9333"   # master: cluster status page
    volumes:
      - s3-data:/data
      - ./s3/s3.json:/etc/seaweedfs/s3.json:ro
    restart: unless-stopped

  # Creates buckets "mlflow" & "dvc" at first start, then stops
  s3-init:
    build: ./docker/mlflow
    image: mlops-mlflow:3.17.2
    entrypoint: ["python", "/scripts/create_buckets.py"]
    environment:
      <<: *s3-env
      BUCKETS: mlflow,dvc
    volumes:
      - ./s3/create-buckets.py:/scripts/create_buckets.py:ro
    depends_on:
      - s3
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Tracking + Model Registry. Artifacts flow through the server (--serve-artifacts) so clients don't need s3 creds
  mlflow:
    build: ./docker/mlflow
    image: mlops-mlflow:3.17.2
    command: >
      mlflow server
      --workers 1
      --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql+psycopg://mlflow:mlflow@postgres:5432/mlflow
      --artifacts-destination s3://mlflow
      --serve-artifacts
      --allowed-hosts "localhost,localhost:*,127.0.0.1:*,mlflow:*,host.docker.internal:*,*.app.github.dev"
    environment:
      <<: *s3-env
      MLFLOW_DISABLE_AGENT_HINT: "1"
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"  # ~10 GenAI job processes we don't use, ~1.8 GB of memory
    healthcheck:  # the API waits for it (depends_on: service_healthy)
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 5s
      timeout: 3s
      retries: 30
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Our API, in the "app" profile: `make dev-up` doesn't start it, `make app-up` does.
  # Its image holds the model exported into model/ (make export) at build time.
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: ride-api:dev
    profiles: ["app"]
    environment:  # the image has no model: it loads @production from the dev MLflow at startup (ADR 007)
      MODEL_URI: ${MODEL_URI:-models:/ride-classifier@production}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      RECKLESS_THRESHOLD: ${RECKLESS_THRESHOLD:-0.5}
    ports:
      - "8000:8000"
    depends_on:
      mlflow:
        condition: service_healthy
    restart: unless-stopped

  # The web app, also in the "app" profile. It reaches the API by its service name.
  webapp:
    build:
      context: .
      dockerfile: docker/webapp/Dockerfile
    image: ride-webapp:dev
    profiles: ["app"]
    environment:
      API_URL: http://api:8000
    volumes:  # example rides are course data: generated locally (make webapp-examples), never in the image
      - ./webapp/examples:/app/webapp/examples:ro
    ports:
      - "8501:8501"
    depends_on:
      - api
    restart: unless-stopped

  # Monitoring profile scrapes the API and exporter running on the host. It is opt-in.
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    profiles: ["monitoring"]
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped


volumes:
  s3-data:
  pg-data:
