# S3 storage (SeaweedFS), same version and settings as docker-compose.yml.
# Buckets: mlflow (MLflow's files) and dvc (data), created by buckets-job.yaml.
# Credentials: Secret seaweedfs-s3-config, created by `make k8s-secrets` (never committed).
apiVersion: apps/v1
kind: StatefulSet  # stateful: keeps its disk (PVC) across restarts
metadata:
  name: s3
  labels: { app: s3 }
spec:
  serviceName: s3
  replicas: 1
  selector:
    matchLabels: { app: s3 }
  template:
    metadata:
      labels: { app: s3 }
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.54
          args: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-volume.max=20"]
          ports:
            - { name: s3, containerPort: 8333 }
            - { name: filer, containerPort: 8888 }
          readinessProbe:
            tcpSocket: { port: 8333 }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: s3-config, mountPath: /etc/seaweedfs, readOnly: true }
      volumes:
        - name: s3-config
          secret: { secretName: seaweedfs-s3-config }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 5Gi } }
---
# In-cluster address: http://s3:8333 (MLflow, the buckets Job)
apiVersion: v1
kind: Service
metadata:
  name: s3
spec:
  selector: { app: s3 }
  ports:
    - { name: s3, port: 8333, targetPort: 8333 }
    - { name: filer, port: 8888, targetPort: 8888 }
---
# From the laptop: S3 API on :8086 (DVC remote of production), file browser on :8085/buckets/
apiVersion: v1
kind: Service
metadata:
  name: s3-external
spec:
  type: NodePort
  selector: { app: s3 }
  ports:
    - { name: s3, port: 8333, targetPort: 8333, nodePort: 30086 }
    - { name: filer, port: 8888, targetPort: 8888, nodePort: 30085 }
