# The web app: calls the API through its Service name. From the laptop: http://127.0.0.1:8081
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ride-webapp
  labels: { app: ride-webapp }
spec:
  replicas: 1
  selector:
    matchLabels: { app: ride-webapp }
  template:
    metadata:
      labels: { app: ride-webapp }
    spec:
      containers:
        - name: webapp
          image: ride-webapp  # its tag is set in kustomization.yaml
          imagePullPolicy: IfNotPresent
          env:
            - { name: API_URL, value: "http://ride-api" }
          ports:
            - { containerPort: 8501 }
          volumeMounts:  # the example rides, if make k8s-examples put them in the cluster (never in the image)
            - { name: examples, mountPath: /app/webapp/examples, readOnly: true }
          readinessProbe:
            httpGet: { path: /_stcore/health, port: 8501 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /_stcore/health, port: 8501 }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        # One ConfigMap per golden example ride (make k8s-examples, k8s/examples.sh), all optional: without them
        # the page starts and offers the upload only. Names follow webapp/make_examples.py: one ride per category.
        - name: examples
          projected:
            sources:
              - configMap: { name: webapp-example-safe, optional: true }
              - configMap: { name: webapp-example-safe-overall, optional: true }
              - configMap: { name: webapp-example-bad-weather, optional: true }
              - configMap: { name: webapp-example-tandem, optional: true }
              - configMap: { name: webapp-example-reckless, optional: true }
---
apiVersion: v1
kind: Service
metadata:
  name: ride-webapp
spec:
  type: NodePort
  selector: { app: ride-webapp }
  ports:
    - { port: 80, targetPort: 8501, nodePort: 30081 }
