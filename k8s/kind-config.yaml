# The production cluster: kind = Kubernetes in Docker, as in the S5 lab (docs/PLAN.md §5, §11).
#   make kind-up        (kind create cluster --config k8s/kind-config.yaml)
# kind reaches the Services through NodePorts mapped to host ports below. These mappings are fixed when the cluster
# is created: adding one later means recreating the cluster.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ride-mlops
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 30080, hostPort: 8080, protocol: TCP }  # API
      - { containerPort: 30081, hostPort: 8081, protocol: TCP }  # web app
      - { containerPort: 30082, hostPort: 8082, protocol: TCP }  # MLflow
      - { containerPort: 30083, hostPort: 8083, protocol: TCP }  # Grafana (monitoring, OPS-1)
      - { containerPort: 30084, hostPort: 8084, protocol: TCP }  # Prometheus (monitoring, OPS-1)
      - { containerPort: 30085, hostPort: 8085, protocol: TCP }  # S3 file browser (SeaweedFS filer)
      - { containerPort: 30086, hostPort: 8086, protocol: TCP }  # S3 API (DVC remote of production)
