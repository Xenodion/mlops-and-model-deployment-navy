[project]
name = "ride-classifier"
version = "0.1.0"
description = "Classify the IMU recording of a ride into 5 riding categories, served with a full MLOps stack (course project)."
readme = "README.md"
authors = [
    { name = "Xenodion", email = "alexandre.waerniers@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pyarrow>=25",  # mlflow 3.17 (same version as the MLflow server image) needs pyarrow < 26
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "torch>=2.15",  # the CNN: needed to train it and to serve it (CPU build, see [tool.uv.sources])
]

# PyTorch's CPU-only index: the default Linux build drags in ~3 GB of GPU (CUDA) libraries we never use.
# macOS keeps PyPI's build (CPU-only there anyway, and not on the CPU index).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

# Each image installs only its group: `uv sync --no-default-groups --group api`.
# Owners add groups as they start their task, e.g. `uv add --group api fastapi`.
[dependency-groups]
api = [
    "fastapi>=0.163.1",
    "mlflow-skinny~=3.17.2",
    "prometheus-client>=0.26.0",
    "python-multipart>=0.0.34",
    "uvicorn[standard]>=0.54.0",
]
dev = [
    "httpx2>=2.16.2",
    "ipykernel>=7.4.0",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
infra = [
    "onnx>=1.23.2",
    "onnxruntime>=1.32.0",
    "psutil>=7.2.2",
]
loadtest = [
    "locust>=2.47.0",
]
train = [
    "dvc[s3]>=3.67.1",
    "matplotlib>=3.11.2",
    "mlflow~=3.17.2",
    "seaborn>=0.13.2",
]
webapp = [
    "httpx2>=2.16.2",
    "streamlit>=1.67.0",
]

[tool.uv]
# `uv sync` on a laptop or in CI installs everything: dev tools, training stack, API. Images pick one group.
default-groups = ["dev", "train", "api", "webapp", "infra", "loadtest"]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["notebooks"]
force-exclude = true  # also skip notebooks/ when files are passed explicitly (git hooks), like CI does

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# importlib mode: test files in different folders may share a name (tests/unit/data/test_x.py, tests/unit/api/test_x.py)
addopts = ["--import-mode=importlib"]
# Deprecation notices raised inside MLflow and its dependencies, not in our code (same choice as the lab 5 project)
filterwarnings = [
    "ignore::DeprecationWarning:mlflow.*",
    "ignore::DeprecationWarning:sqlalchemy.*",
    "ignore:Operation with range is deprecated:Warning:mlflow.*",
]
