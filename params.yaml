# Pipeline parameters: read by ride_classifier.config.load_params(), tracked by DVC, logged to MLflow.
# Section still to add, with its task: drift (OPS-2). See docs/PLAN.md §6.1.
data:
  raw_rides: data/raw/GBG500.parquet
  raw_labels: data/raw/GBG500_labels.csv
  train_path: data/processed/train.parquet
  golden_path: data/processed/golden.parquet   # frozen held-out rides, used only by the evaluation gate
  splits_path: data/processed/splits.csv       # one row per ride: label, split, CV fold (committed to git)
  golden_share: 0.2
  cv_folds: 5
  seed: 42
  srv3490:
    raw_path: data/raw/SRV3490.parquet
    # rad/s -> deg/s = 180/pi. Measured GBG500/SRV3490 median-std ratio (notebook 02): rotation ~60 (95% CI 58-62),
    # accelerations 0.77-0.97: the datasets also differ in riders/cities, so the ~5 % gap is population, not units.
    rotation_factor: 57.2958

train:
  experiment_id: E3          # experiment plan and results: docs/PLAN.md §6.5 (logged as an MLflow tag)
  model: cnn                 # baseline (statistics + logistic regression) or cnn (1D CNN on windows)
  baseline:
    C: 0.05                  # inverse regularisation strength: small = simpler model (400 rides, ~170 statistics)
    max_iter: 5000
  cnn:
    window_s: 30             # window length: 300 readings at 10 Hz
    stride_s: 15             # a new window every 15 s: ~19 overlapping windows per ride
    filters: [32, 64, 64]    # one convolution block per value: its number of filters
    kernel: 7                # filter width: 0.7 s
    dropout: 0.3
    epochs: 10               # 20 overfitted (E2): CV 0.31, golden 0.29 -> 10 (E3): CV 0.36, golden 0.51
    batch_size: 64
    learning_rate: 0.001
    weight_decay: 0.0001     # small penalty on large weights, against overfitting
    augment: true            # random ±10 % scaling + noise on training windows
    class_weight: sqrt       # balanced over-predicted the rare categories (E1: golden 0.18); sqrt = softer
  model_path: artifacts/model                  # MLflow model, read by the evaluate stage and the API
  oof_path: artifacts/oof_predictions.csv      # cross-validated prediction for every train ride
  metrics_path: artifacts/cv_metrics.json      # DVC metrics: `uv run dvc metrics show`
  run_path: artifacts/train_run.json           # MLflow run id and model URI, used to register the model

evaluate:
  metrics_path: artifacts/golden_metrics.json             # DVC metrics: `uv run dvc metrics show`
  predictions_path: artifacts/golden_predictions.csv      # probabilities + prediction for every golden ride
  confusion_matrix_path: artifacts/golden_confusion_matrix.png
  gate:                       # the model passes only if every check passes; otherwise the stage fails (exit 1)
    min_macro_f1: 0.30        # floor = 1.5x random (≈ 0.20). First baseline: CV 0.37 ± 0.06, golden 0.48
    must_beat_references: true  # golden macro-F1 above "always Safe" and random guessing on the same rides
