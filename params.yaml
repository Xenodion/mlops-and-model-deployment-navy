# Pipeline parameters: read by ride_classifier.config.load_params(), tracked by DVC, logged to MLflow.
# Sections still to add, with their task: gate (MOD-2), drift (OPS-2). See docs/PLAN.md §6.1.
data:
  raw_rides: data/raw/GBG500.parquet
  raw_labels: data/raw/GBG500_labels.csv
  train_path: data/processed/train.parquet
  golden_path: data/processed/golden.parquet   # frozen held-out rides, used only by the evaluation gate
  splits_path: data/processed/splits.csv       # one row per ride: label, split, CV fold (committed to git)
  golden_share: 0.2
  cv_folds: 5
  seed: 42

train:
  experiment_id: E0          # experiment plan, docs/PLAN.md §6.5 (logged as an MLflow tag)
  model: baseline            # baseline = per-ride statistics + logistic regression (the CNN comes with MOD-4)
  baseline:
    C: 0.05                  # inverse regularisation strength: small = simpler model (400 rides, ~170 statistics)
    max_iter: 5000
  model_path: artifacts/model                  # MLflow model, read by the evaluate stage and the API
  oof_path: artifacts/oof_predictions.csv      # cross-validated prediction for every train ride
  metrics_path: artifacts/cv_metrics.json      # DVC metrics: `uv run dvc metrics show`
  run_path: artifacts/train_run.json           # MLflow run id and model URI, used to register the model
