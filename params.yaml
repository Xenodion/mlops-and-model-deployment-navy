# Pipeline parameters: read by ride_classifier.config.load_params(), tracked by DVC, logged to MLflow.
drift:
  psi_alert: 0.1
  psi_retrain: 0.25
  live_alerts_enabled: false  # Disabled until realistic ride-level sampling and thresholds are validated
  chi2_pvalue: 0.01
  min_labels: 20
data:
  raw_rides: data/raw/GBG500.parquet
  raw_labels: data/raw/GBG500_labels.csv
  train_path: data/processed/train.parquet
  golden_path: data/processed/golden.parquet   # frozen held-out rides, used only by the evaluation gate
  splits_path: data/processed/splits.csv       # one row per ride: label, split, CV fold (committed to git)
  golden_share: 0.2
  cv_folds: 5
  seed: 42
  srv3490:
    raw_path: data/raw/SRV3490.parquet
    clean_path: data/processed/srv3490.parquet   # converted + cleaned (stage prepare_srv)
    # rad/s -> deg/s = 180/pi. Measured GBG500/SRV3490 median-std ratio (notebook 02): rotation ~60 (95% CI 58-62),
    # accelerations 0.77-0.97: the datasets also differ in riders/cities, so the ~5 % gap is population, not units.
    rotation_factor: 57.2958

train:
  experiment_id: E3          # experiment plan and results: docs/PLAN.md §6.5 (logged as an MLflow tag)
  model: cnn                 # baseline (statistics + logistic regression) or cnn (1D CNN on windows)
  baseline:
    C: 0.05                  # inverse regularisation strength: small = simpler model (400 rides, ~170 statistics)
    max_iter: 5000
  cnn:
    window_s: 30             # window length: 300 readings at 10 Hz
    stride_s: 15             # a new window every 15 s: ~19 overlapping windows per ride
    filters: [32, 64, 64]    # one convolution block per value: its number of filters
    kernel: 7                # filter width: 0.7 s
    dropout: 0.3
    epochs: 10               # 20 overfitted (E2): CV 0.31, golden 0.29 -> 10 (E3): CV 0.36, golden 0.51
    batch_size: 64
    learning_rate: 0.001
    weight_decay: 0.0001     # small penalty on large weights, against overfitting
    augment: true            # random ±10 % scaling + noise on training windows
    class_weight: sqrt       # balanced over-predicted the rare categories (E1: golden 0.18); sqrt = softer
  danger:                    # label-free autoencoder (specs R1); the head alone uses labels
    window_s: 30             # provisional window until the window study (R15)
    stride_s: 15
    filters: [32, 64, 64]
    kernel: 7
    epochs: 10
    batch_size: 64
    learning_rate: 0.001
    weight_decay: 0.0001
    head_C: 0.05             # as the baseline's C
    class_weight: sqrt
  model_path: artifacts/model                  # MLflow model, read by the evaluate stage and the API
  oof_path: artifacts/oof_predictions.csv      # cross-validated prediction for every train ride
  metrics_path: artifacts/cv_metrics.json      # DVC metrics: `uv run dvc metrics show`
  run_path: artifacts/train_run.json           # MLflow run id and model URI, used to register the model

evaluate:
  metrics_path: artifacts/golden_metrics.json             # DVC metrics: `uv run dvc metrics show`
  predictions_path: artifacts/golden_predictions.csv      # probabilities + prediction for every golden ride
  confusion_matrix_path: artifacts/golden_confusion_matrix.png
  elapsed_path: artifacts/golden_f1_vs_elapsed.csv        # macro-F1 of the cumulative prediction vs elapsed time
  elapsed_times_s: [30, 60, 120, 300, 600, .inf]          # .inf = the whole ride
  gate:                       # the model passes only if every check passes; otherwise the stage fails (exit 1)
    min_macro_f1: 0.30        # floor = 1.5x random (≈ 0.20). First baseline: CV 0.37 ± 0.06, golden 0.48
    must_beat_references: true  # golden macro-F1 above "always Safe" and random guessing on the same rides

falls:
  groups_path: data/processed/fall_groups.csv   # one row per SRV3490 ride: group, role, development/held_out (committed to git)
  held_out_share: 0.3        # share of fall groups, per city, never trained on nor used to choose
  seed: 42
  pre_fall_s: 60             # pre-fall segment: smallest length giving every window candidate (up to 60 s, stride 30 s) >= 2 window ends
  margin_s: 2                # excluded just before the first topple (impact); = the spec's minimum warning time

drift_scenarios:
  seed: 42
  n_rides: 100
  srv_city: 1                # unseen by the GBG500 classifier, not necessarily by the fall-risk model
  riskier_weights: {Safe: 1, Safe overall: 1, Bad weather: 2, Tandem: 2, Reckless: 6}

loadtest:
  source_path: data/processed/train.parquet  # real training rides, never the frozen golden set
  speed: 1.0                                # 1 = real time; report any other factor
  initial_users: 10
  step_users: 10
  step_duration_s: 60
  max_users: 100
  spawn_rate: 2

fall_risk:                   # model 2 (ADR 001, 004): 10 s windows, logistic regression on their statistics
  window_s: 10
  stride_s: 5
  pre_fall_s: 60             # positives end in the 60 s before the gap
  gap_s: 5                   # anti-leakage gap before the first topple
  check_gap_s: 10            # sanity check: the held-out result must not collapse with a larger gap
  c: 1.0                     # logistic regression regularisation (default, not tuned)
  seed: 42
  experiment: fall-risk
  model_path: artifacts/fall_risk_model.joblib
  run_path: artifacts/fall_risk_run.json
  metrics_path: artifacts/fall_risk_metrics.json
  scores_path: artifacts/fall_risk_heldout_scores.csv   # risk of every held-out window, both gaps
  roc_path: artifacts/fall_risk_roc.png                 # F49: ROC curves, gap 5 s and 10 s
  gate:
    min_paired_auc: 0.55     # held-out paired AUC must beat chance (0.5) with a margin
